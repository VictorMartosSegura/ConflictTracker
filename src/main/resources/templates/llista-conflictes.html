<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Llista de Conflictes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Llista de Conflictes (render al server)</h2>
        <a class="btn btn-primary" th:href="@{/web/conflicts/new}">+ Nou Conflicte</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Nom</th>
                    <th>Data inici</th>
                    <th>Estat</th>
                    <th>Descripció</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="conflicte : ${llistaConflictes}">
                    <td th:text="${conflicte.name}"></td>
                    <td th:text="${conflicte.startDate}"></td>
                    <td th:text="${conflicte.status}"></td>
                    <td th:text="${conflicte.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
