<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nou Conflicte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Crear nou conflicte</h2>
        <a class="btn btn-outline-secondary" th:href="@{/web/conflicts}">← Tornar al llistat</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/web/conflicts}" th:object="${conflictForm}" method="post">

                <!-- NAME -->
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input class="form-control" type="text" th:field="*{name}">
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- START DATE -->
                <div class="mb-3">
                    <label class="form-label">Data d'inici</label>
                    <input class="form-control" type="date" th:field="*{startDate}">
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                </div>

                <!-- STATUS -->
                <div class="mb-3">
                    <label class="form-label">Estat</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="" disabled selected>-- selecciona --</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                </div>

                <!-- DESCRIPTION -->
                <div class="mb-3">
                    <label class="form-label">Descripció</label>
                    <textarea class="form-control" rows="5" th:field="*{description}"></textarea>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <button class="btn btn-success w-100" type="submit">Guardar</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
