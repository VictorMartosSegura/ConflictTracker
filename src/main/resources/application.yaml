spring:
  application:
    name: ConflictTracker

  datasource:
    url: jdbc:h2:mem:conflict-tracker
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}



